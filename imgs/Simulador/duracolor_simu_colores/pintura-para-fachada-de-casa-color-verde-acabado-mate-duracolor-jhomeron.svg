<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 3 3">
  <defs>
    <style>
      .cls-1 {
        fill: #002e1d;
      }

      .cls-1, .cls-2 {
        stroke-width: 0px;
      }

      .cls-3 {
        isolation: isolate;
      }

      .cls-2 {
        fill: #24c9b9;
      }

      .cls-4 {
        mix-blend-mode: multiply;
      }
    </style>
  </defs>
  <g class="cls-3">
    <g id="Capa_1" data-name="Capa 1">
      <g id="Capa_1-2" data-name="Capa 1-2">
        <rect class="cls-1" y="0" width="3" height="3" rx=".5" ry=".5"/>
      </g>
      <g id="Capa_1-2-2" data-name="Capa 1-2-2" class="cls-4">
        <rect class="cls-2" y="0" width="3" height="3" rx=".5" ry=".5"/>
      </g>
    </g>
  </g>
</svg>