<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reclamación enviada | Jhomeron</title>
  <link rel="icon" href="imgs/pinturas-jhomeron-peru.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="stylesFooter.css" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet" />
  <style>
    .gracias-container {
      max-width: 800px;
      margin: 50px auto;
      padding: 40px;
      text-align: center;
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }

    .gracias-icon {
      color: #0d3393;
      font-size: 80px;
      margin-bottom: 20px;
    }

    .gracias-title {
      color: #0d3393;
      font-size: 32px;
      margin-bottom: 20px;
      font-weight: 700;
    }

    .gracias-text {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
      line-height: 1.6;
    }

    .gracias-btn {
      background-color: #0d3393;
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 25px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.3s;
      text-decoration: none;
      display: inline-block;
    }

    .gracias-btn:hover {
      background-color: #ef0606;
    }
  </style>
</head>

<body>
  <!-- Header (incluye tu header como en las otras páginas) -->
  <!-- Contenido principal -->
  <div class="main-content">
    <div class="gracias-container">
      <i class="fas fa-check-circle gracias-icon"></i>
      <h1 class="gracias-title">¡Reclamación Enviada!</h1>
      <p class="gracias-text">
        Su reclamación ha sido recibida correctamente. Hemos enviado una copia a su correo electrónico.
        <br>
        Nos pondremos en contacto con usted lo antes posible.
      </p>
      <a href="index.html" class="gracias-btn">Volver al inicio</a>
    </div>
  </div>
  <!-- Footer (incluye tu footer como en las otras páginas) -->
</body>

</html>
